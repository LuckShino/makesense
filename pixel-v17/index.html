<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5ead1">
<title>MAKE SENSE V17</title>
<style>
body{margin:0;background:#f4ead1;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;color:#5b4a3d;display:grid;place-items:center;min-height:100vh}
#boot{padding:24px;text-align:center}
</style>
</head>
<body>
<div id="boot">ことばの街を読み込み中…</div>
<script>
(async()=>{
  const files=["../pixel-v16/chunks/000.txt","../pixel-v16/chunks/001.txt","../pixel-v16/chunks/002.txt","../pixel-v16/chunks/003.txt","../pixel-v16/chunks/004.txt","../pixel-v16/chunks/005.txt","../pixel-v16/chunks/006.txt","../pixel-v16/chunks/007.txt","../pixel-v16/chunks/008.txt","../pixel-v16/chunks/009.txt","../pixel-v16/chunks/010.txt","../pixel-v16/chunks/011.txt"];
  const [characters,...parts]=await Promise.all([
    fetch("characters.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("characters.json "+r.status);return r.json()}),
    ...files.map(f=>fetch(f,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(f+" "+r.status);return r.text()}))
  ]);
  let html=parts.join("");
  const marker="window.MS_INLINE_ART=";
  const start=html.indexOf(marker);
  const end=html.indexOf(";</scr"+"ipt>",start);
  if(start<0||end<0)throw new Error("MS_INLINE_ART not found");
  const jsonStart=start+marker.length;
  const art=JSON.parse(html.slice(jsonStart,end));
  for(const [key,value] of Object.entries(characters)) art[key]=value;
  html=html.slice(0,jsonStart)+JSON.stringify(art)+html.slice(end);
  html=html.replace("<title>メイクセンス | MAKE SENSE</title>","<title>メイクセンス | MAKE SENSE V17</title>");
  document.open();
  document.write(html);
  document.close();
})().catch(e=>{
  document.getElementById("boot").textContent="読み込みに失敗しました。再読み込みしてください。";
  console.error(e);
});
</script>
</body>
</html>
