<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKE SENSE V15</title><style>body{margin:0;background:#f4ead1;font-family:system-ui;color:#5b4a3d;display:grid;place-items:center;min-height:100vh}#boot{padding:24px;text-align:center}</style></head><body><div id="boot">ことばの街を読み込み中…</div><script>(async()=>{const fs=["chunks/000.txt","chunks/001.txt","chunks/002.txt"];let h="";for(const f of fs){const r=await fetch(f);if(!r.ok)throw new Error(f+" "+r.status);h+=await r.text()}document.open();document.write(h);document.close()})().catch(e=>{document.getElementById("boot").textContent="読み込みに失敗しました。再読み込みしてください。";console.error(e)})</script></body></html>
